name: publish

# Builds a release of each changed line on Zode, waits until it is published
# everywhere, then writes the software lists back to the repo.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "!images/*/README.md"
      - "!images/*/PARITY.md"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      line:
        description: "Line to release (a directory under images/); empty for every line"
        required: false
        default: ""

permissions:
  id-token: write
  contents: write

# One publish run at a time; a newer run waits instead of cancelling.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: zode-2x4
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the rendered Dockerfiles
        run: scripts/render.sh --check

      - name: Pick the lines to release
        id: lines
        env:
          EVENT: ${{ github.event_name }}
          INPUT_LINE: ${{ inputs.line }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all=$(find images -mindepth 2 -maxdepth 2 -name Dockerfile | cut -d/ -f2 | sort)
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ -z "$INPUT_LINE" ]; then
              lines=$all
            elif printf '%s\n' "$all" | grep -x -- "$INPUT_LINE" >/dev/null; then
              lines=$INPUT_LINE
            else
              echo "::error::no line $INPUT_LINE under images/"
              exit 1
            fi
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch or unknown base: release everything.
            lines=$all
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            if printf '%s\n' "$changed" | grep -x 'scripts/software-report.sh' >/dev/null; then
              # The report is inlined in every Dockerfile.
              lines=$all
            else
              # Only a change to a line's Dockerfile builds it; its README
              # is written by this workflow.
              lines=$(printf '%s\n' "$changed" | sed -nE 's#^images/([^/]+)/Dockerfile(\.in)?$#\1#p' | sort -u)
            fi
          fi
          json=$(printf '%s\n' "$lines" | jq -Rnc '[inputs | select(length > 0)]')
          echo "lines=$json" >> "$GITHUB_OUTPUT"
          echo "Lines to release: $json"

  release:
    needs: plan
    if: needs.plan.outputs.lines != '[]'
    runs-on: zode-2x4
    # Each node builds one official image at a time: release lines in turn.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        line: ${{ fromJSON(needs.plan.outputs.lines) }}
    # A release can take a while: one build per node and size, in turn.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          version="$(date -u +%Y%m%d).${{ github.run_number }}"
          # A re-run of the same run needs its own version (they are unique).
          if [ "${{ github.run_attempt }}" != 1 ]; then version="$version.${{ github.run_attempt }}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing ${{ matrix.line }} $version"

      - name: Release on Zode
        run: scripts/release.sh "${{ matrix.line }}" "${{ steps.version.outputs.version }}"

      # Regenerate the lists on top of the latest main on every try, so a
      # line released just before this one never conflicts on README.md.
      - name: Write the software lists, commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            scripts/update-docs.sh "$LINE" "$VERSION"
            git add README.md "images/$LINE/README.md"
            # What still differs from GitHub's image, for lines that have a
            # GitHub counterpart (images/<line>/parity.tsv).
            if [ -f "images/$LINE/parity.tsv" ]; then
              scripts/parity.sh "$LINE" >"images/$LINE/PARITY.md"
              git add "images/$LINE/PARITY.md"
            fi
            if git diff --cached --quiet; then
              echo "Software lists unchanged"
              exit 0
            fi
            git commit -q -m "docs: software list for $LINE $VERSION [skip ci]"
            git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the software lists"
          exit 1

      # A GitHub release per image release: the software list and, for lines
      # with a GitHub counterpart, what still differs from it.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch -q origin main
          git reset -q --hard origin/main
          {
            echo "\`zode/$LINE\` $VERSION, built from ${GITHUB_SHA:0:7}. Software list: [images/$LINE/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$LINE/$VERSION/images/$LINE/README.md)."
            echo
            if [ -f "images/$LINE/PARITY.md" ]; then sed '1d' "images/$LINE/PARITY.md"; fi
          } >notes.md
          gh release create "$LINE/$VERSION" --target "$(git rev-parse HEAD)" \
            --title "$LINE $VERSION" --notes-file notes.md --latest=false
