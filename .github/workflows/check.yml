name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: zode-2x4
    env:
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Rendered Dockerfiles match their templates
        run: scripts/render.sh --check

      - name: shellcheck the RUN steps as bash
        run: scripts/lint-steps.sh

      - name: hadolint
        run: |
          for f in images/*/Dockerfile; do
            echo "$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/hadolint.yaml:ro" "$HADOLINT_IMAGE" \
              hadolint --config /hadolint.yaml - < "$f"
          done

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      # Jobs run as the runner user: every path GitHub's ubuntu-24.04 leaves
      # writable (and Playwright's browser folder) must be writable here too.
      # This job runs on the published ci-ubuntu-24.04, so it catches a
      # release that ships one of them root-owned.
      - name: The runner user can write GitHub's writable paths
        run: |
          id -un
          pw=${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
          fail=0
          for d in /opt /usr/share /usr/lib/jvm "$pw" "$RUNNER_TOOL_CACHE" /usr/local/lib/node_modules /usr/local/bin; do
            if mkdir "$d/.zode-write-check-$$" && rmdir "$d/.zode-write-check-$$"; then
              echo "ok   $d"
            else
              echo "::error::the runner user cannot write $d"
              fail=1
            fi
          done
          exit "$fail"

      - name: Software report smoke test
        run: |
          out=$(bash scripts/software-report.sh)
          printf '%s\n' "$out"
          [ "$(printf '%s\n' "$out" | wc -l)" -eq 1 ] || { echo "expected one line"; exit 1; }
          case "$out" in "ZODE-MANIFEST {"*) ;; *) echo "missing the ZODE-MANIFEST prefix"; exit 1 ;; esac
          printf '%s\n' "${out#ZODE-MANIFEST }" > manifest.json
          jq -e '
            (.os | type == "string" and length > 0)
            and (.groups | type == "array" and length > 0)
            and all(.groups[]; (.name | type == "string") and (.items | type == "array")
              and all(.items[]; (.name | type == "string") and (.version | type == "string" and length > 0)))
            and ((.env // {}) | type == "object")
          ' manifest.json
          scripts/manifest-to-md.sh --manifest manifest.json

      - name: Difference list against GitHub's ubuntu-24.04
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/parity.sh --manifest manifest.json ci-ubuntu-24.04 > parity.md
          head -n 20 parity.md
